name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # PyQt6 needs these XCB/EGL libs even under the offscreen platform
        # because the platform plugin itself links against them. ffmpeg is
        # used by tests that exercise the FrameExtractor QProcess wrapper.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libegl1 \
            libgl1 \
            libfontconfig1 \
            libdbus-1-3 \
            ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check stackant/ tests/

      - name: Unit + headless-smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        # Tests that need the real Uganda video auto-skip on CI via
        # pytest.mark.skipif(not Path(VIDEO).exists()).
        run: pytest -q
